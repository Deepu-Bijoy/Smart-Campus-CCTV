<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="cctv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cctv-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background container badge for sharp contrast on light/dark themes -->
  <rect width="32" height="32" rx="7" fill="url(#cctv-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#334155" stroke-width="1"/>

  <!-- Wall mount bracket on the left -->
  <rect x="4" y="11" width="2.5" height="11" rx="1.25" fill="#64748b"/>
  <path d="M6.5 16.5H10.5L14 19.5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Protective sun-visor hood -->
  <path d="M10 10.5L25 12.5C25.8 12.6 26.3 13.3 26.2 14L26 15C25.9 15.6 25.3 16 24.7 15.9L9.5 13.9C8.9 13.8 8.5 13.2 8.6 12.6L8.8 11.6C8.9 11 9.4 10.5 10 10.5Z" fill="url(#cctv-blue)"/>

  <!-- Camera bullet housing -->
  <path d="M10.5 13.5L23.2 15.2C24 15.3 24.5 16 24.4 16.8L23.8 21.2C23.7 22 23 22.5 22.2 22.4L9.5 20.7C8.7 20.6 8.2 19.9 8.3 19.1L8.9 14.7C9 13.9 9.7 13.4 10.5 13.5Z" fill="#f8fafc"/>

  <!-- Front camera lens assembly -->
  <path d="M22.8 15.2L25.6 15.6C26.3 15.7 26.8 16.3 26.7 17L26.1 21.4C26 22.1 25.4 22.6 24.7 22.5L21.9 22.1" fill="#0f172a"/>
  <ellipse cx="25" cy="18.8" rx="1" ry="2.4" fill="#38bdf8"/>
  <ellipse cx="25" cy="18.8" rx="0.5" ry="1.3" fill="#0284c7"/>

  <!-- Active recording LED indicator -->
  <circle cx="19.5" cy="17" r="1.1" fill="#ef4444"/>
</svg>